name: Python CI Pipeline

# Trigger: Pipeline berjalan setiap kali ada push atau Pull Request ke branch 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Menggunakan server Ubuntu virtual milik GitHub

    steps:
    # Langkah 1: Mengambil kode dari repository ke server virtual
    - name: Checkout code
      uses: actions/checkout@v4

    # Langkah 2: Menyiapkan lingkungan Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Langkah 3: Menginstall semua library yang dibutuhkan
    - name: Install dependencies
      run: |
        python -m pip upgrade pip
        pip install -r requirements.txt

    # Langkah 4: Linting (Mengecek kerapian dan standar penulisan kode)
    - name: Run Lint (flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Langkah 5: Menjalankan Automated Testing (Pytest)
    - name: Run Test (pytest)
      run: |
        pytest